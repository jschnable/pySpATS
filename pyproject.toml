[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pySpATS"
version = "0.3.0"
description = "Spatial correction of field trials with R-validated tensor P-spline mixed models"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "James Schnable Lab", email = "jschnable@unl.edu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7", "matplotlib>=3.6"]

[project.urls]
Source = "https://github.com/jschnable/pySpATS"
Issues = "https://github.com/jschnable/pySpATS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyspats*"]
exclude = ["pyspats.reml*", "pyspats.spatial*"]

[tool.setuptools.package-data]
pyspats = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
line-ending = "lf"
